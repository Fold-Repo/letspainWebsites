# Host nginx → Let's All Paints on 127.0.0.1:3020
# https://letsallpaint.com

server {
    listen 80;
    listen [::]:80;
    server_name letsallpaint.com www.letsallpaint.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://letsallpaint.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.letsallpaint.com;

    ssl_certificate /etc/letsencrypt/live/letsallpaint.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/letsallpaint.com/privkey.pem;

    return 301 https://letsallpaint.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name letsallpaint.com;

    ssl_certificate /etc/letsencrypt/live/letsallpaint.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/letsallpaint.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
