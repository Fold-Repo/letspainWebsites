# Production stack on the VPS.
# IMAGE_PLACEHOLDER is replaced by the deploy workflow with the GHCR image tag.
# Host nginx (already on 80/443) proxies https://letsallpaint.com to 127.0.0.1:3020.
# Postgres stays on the Docker network.
# Create /var/www/lets-all-paints/.env once. GitHub never overwrites it.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paints
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: letsallpaints
    volumes:
      - paints-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paints -d letsallpaints"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: IMAGE_PLACEHOLDER
    container_name: lets-all-paints
    restart: unless-stopped
    ports:
      - "127.0.0.1:3020:3010"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3010
      HOSTNAME: 0.0.0.0
      PUBLIC_SITE_URL: https://letsallpaint.com
      DATABASE_URL: postgres://paints:${POSTGRES_PASSWORD}@db:5432/letsallpaints
    volumes:
      - paints-uploads:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  paints-pg:
  paints-uploads:
