# Production stack on the VPS.
# IMAGE_PLACEHOLDER is replaced by the deploy workflow with the GHCR image tag.
# The site is only reached through nginx on 80/443. Postgres stays on the Docker network.
# Create /var/www/lets-all-paints/.env once. GitHub never overwrites it.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paints
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: letsallpaints
    volumes:
      - paints-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paints -d letsallpaints"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: IMAGE_PLACEHOLDER
    container_name: lets-all-paints
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3010
      HOSTNAME: 0.0.0.0
      PUBLIC_SITE_URL: https://letsallpaint.com
      DATABASE_URL: postgres://paints:${POSTGRES_PASSWORD}@db:5432/letsallpaints
    depends_on:
      db:
        condition: service_healthy

  certs:
    image: alpine:3.20
    volumes:
      - nginx-ssl:/etc/nginx/ssl
      - certbot-certs:/etc/letsencrypt
      - ./nginx/init-cert.sh:/init-cert.sh:ro
    entrypoint: ["/bin/sh", "/init-cert.sh"]
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    container_name: lets-all-paints-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      certs:
        condition: service_completed_successfully
      web:
        condition: service_started

  certbot:
    image: certbot/certbot
    profiles: ["renew"]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: /bin/sh -c
    command:
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet || true
          sleep 12h & wait $$!
        done
    depends_on:
      - nginx

volumes:
  paints-pg:
  nginx-ssl:
  certbot-www:
  certbot-certs:
