name: Deploy

# main → Hetzner VPS. Builds the Docker image, pushes it to GHCR, then
# docker compose pull && up on the server. Postgres data stays in the paints-pg volume.
#
# ---------------------------------------------------------------------------
# SET ON GITHUB (repo secrets)
# ---------------------------------------------------------------------------
#   DEPLOY_HOST            46.62.236.52
#   DEPLOY_USER            root
#   DEPLOY_SSH_KEY         OpenSSH private key (full PEM, including BEGIN/END)
#                          OR DEPLOY_SSH_PASSWORD if the server still uses password login
#   DEPLOY_SSH_PORT        optional, default 22
#   GHCR_TOKEN             PAT with read:packages (the server pulls the image)
#   GHCR_USERNAME          GitHub user that owns the PAT
#
# Optional repo variable:
#   DEPLOY_PATH            default /var/www/lets-all-paints
#   APP_PORT               default 3010
#
# ---------------------------------------------------------------------------
# CREATE ONCE ON THE SERVER (GitHub never overwrites .env)
# ---------------------------------------------------------------------------
#   /var/www/lets-all-paints/.env
#   Docker + Compose
#   Required keys: POSTGRES_PASSWORD, ADMIN_EMAIL, ADMIN_PASSWORD,
#                  ADMIN_SESSION_SECRET, PUBLIC_SITE_URL
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_checks:
        description: "Skip typecheck and build before deploy"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-lets-all-paints
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & Build
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_checks) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [quality]
    if: |
      always() &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped')
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/${REPO}"
          TAG="${GITHUB_SHA::12}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: needs.build-and-push.result == 'success'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/lets-all-paints' }}
      APP_PORT: ${{ vars.APP_PORT || '3010' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare compose file
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          mkdir -p deploy-artifacts
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}:${TAG}|g" \
            deploy/docker-compose.prod.yml > deploy-artifacts/docker-compose.yml
          echo "Deploying ${IMAGE}:${TAG}"

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          script: |
            mkdir -p "${{ env.DEPLOY_PATH }}"

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          source: deploy-artifacts/docker-compose.yml
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1

      - name: Pull image and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          envs: GHCR_TOKEN,GHCR_USERNAME
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
            APP_PORT="${{ env.APP_PORT }}"
            cd "$DEPLOY_PATH"

            if [ ! -f .env ]; then
              echo "ERROR: $DEPLOY_PATH/.env is missing on the server."
              echo "Create it once. GitHub will not overwrite it."
              exit 1
            fi

            for key in POSTGRES_PASSWORD ADMIN_EMAIL ADMIN_PASSWORD ADMIN_SESSION_SECRET PUBLIC_SITE_URL; do
              if ! grep -qE "^[[:space:]]*${key}=" .env; then
                echo "ERROR: ${key} is not set in $DEPLOY_PATH/.env"
                exit 1
              fi
            done

            if [ -z "${GHCR_TOKEN:-}" ]; then
              echo "ERROR: GHCR_TOKEN secret is empty. Create a PAT with read:packages."
              exit 1
            fi

            if ! grep -q '^APP_PORT=' .env 2>/dev/null; then
              echo "APP_PORT=${APP_PORT}" >> .env
            fi

            LOGIN_USER="${GHCR_USERNAME:-${{ github.actor }}}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$LOGIN_USER" --password-stdin

            docker image prune -af || true

            pull_ok=0
            for attempt in 1 2 3; do
              echo "docker compose pull (attempt ${attempt}/3)..."
              if docker compose pull; then
                pull_ok=1
                break
              fi
              sleep 3
            done

            if [ "$pull_ok" -ne 1 ]; then
              echo "ERROR: image pull failed."
              df -h || true
              exit 1
            fi

            docker compose up -d --remove-orphans
            docker image prune -f

            echo "Waiting for health check on :${APP_PORT}..."
            for i in $(seq 1 45); do
              if curl -fsS "http://127.0.0.1:${APP_PORT}/api/health" >/dev/null 2>&1; then
                echo "Deploy healthy."
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed after deploy."
            docker compose ps
            docker compose logs --tail=200 web
            exit 1
