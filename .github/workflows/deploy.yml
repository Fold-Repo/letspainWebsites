name: Deploy

# main → Hetzner VPS. Builds the Docker image, pushes it to GHCR, then
# docker compose pull && up on the server. Postgres data stays in the paints-pg volume.
#
# ---------------------------------------------------------------------------
# SET ON GITHUB (repo secrets)
# ---------------------------------------------------------------------------
#   DEPLOY_HOST            46.62.236.52
#   DEPLOY_USER            root
#   DEPLOY_SSH_KEY         OpenSSH private key (full PEM, including BEGIN/END)
#                          OR DEPLOY_SSH_PASSWORD if the server still uses password login
#   DEPLOY_SSH_PORT        optional, default 22
#   GHCR_TOKEN             PAT with read:packages (the server pulls the image)
#   GHCR_USERNAME          GitHub user that owns the PAT
#
# Optional repo variable:
#   DEPLOY_PATH            default /var/www/lets-all-paints
#
# DNS A records for letsallpaint.com and www.letsallpaint.com → DEPLOY_HOST.
# The VPS already runs host nginx on 80/443. The app listens on 127.0.0.1:3020.
# Deploy installs a host nginx site and a Let's Encrypt certificate.
#
# ---------------------------------------------------------------------------
# CREATE ONCE ON THE SERVER (GitHub never overwrites .env)
# ---------------------------------------------------------------------------
#   /var/www/lets-all-paints/.env
#   Docker + Compose
#   Required keys: POSTGRES_PASSWORD, ADMIN_EMAIL, ADMIN_PASSWORD,
#                  ADMIN_SESSION_SECRET, PUBLIC_SITE_URL
#   PUBLIC_SITE_URL is forced to https://letsallpaint.com by the production compose file.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_checks:
        description: "Skip typecheck and build before deploy"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-lets-all-paints
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & Build
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_checks) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [quality]
    if: |
      always() &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped')
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/${REPO}"
          TAG="${GITHUB_SHA::12}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: needs.build-and-push.result == 'success'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/lets-all-paints' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare compose file
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          mkdir -p deploy-artifacts/nginx
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}:${TAG}|g" \
            deploy/docker-compose.prod.yml > deploy-artifacts/docker-compose.yml
          cp deploy/nginx/letsallpaint.com.conf deploy/nginx/letsallpaint.com.http.conf deploy-artifacts/nginx/
          echo "Deploying ${IMAGE}:${TAG}"

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          script: |
            mkdir -p "${{ env.DEPLOY_PATH }}"

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          source: deploy-artifacts/docker-compose.yml,deploy-artifacts/nginx/letsallpaint.com.conf,deploy-artifacts/nginx/letsallpaint.com.http.conf
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1

      - name: Pull image and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          envs: GHCR_TOKEN,GHCR_USERNAME
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"

            if [ ! -f .env ]; then
              echo "ERROR: $DEPLOY_PATH/.env is missing on the server."
              echo "Create it once. GitHub will not overwrite it."
              exit 1
            fi

            for key in POSTGRES_PASSWORD ADMIN_EMAIL ADMIN_PASSWORD ADMIN_SESSION_SECRET PUBLIC_SITE_URL; do
              if ! grep -qE "^[[:space:]]*${key}=" .env; then
                echo "ERROR: ${key} is not set in $DEPLOY_PATH/.env"
                exit 1
              fi
            done

            if [ -z "${GHCR_TOKEN:-}" ]; then
              echo "ERROR: GHCR_TOKEN secret is empty. Create a PAT with read:packages."
              exit 1
            fi

            LOGIN_USER="${GHCR_USERNAME:-${{ github.actor }}}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$LOGIN_USER" --password-stdin

            pull_ok=0
            for attempt in 1 2 3; do
              echo "docker compose pull (attempt ${attempt}/3)..."
              if docker compose pull; then
                pull_ok=1
                break
              fi
              sleep 3
            done

            if [ "$pull_ok" -ne 1 ]; then
              echo "ERROR: image pull failed."
              df -h || true
              exit 1
            fi

            if ! docker compose up -d --remove-orphans; then
              echo "ERROR: compose up failed."
              ss -tlnp | grep ':3020' || true
              docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
              exit 1
            fi
            docker image prune -f

            if ! command -v curl >/dev/null 2>&1; then
              apt-get update && apt-get install -y curl
            fi

            echo "Waiting for the app on 127.0.0.1:3020..."
            app_ok=0
            for i in $(seq 1 45); do
              if curl -fsS http://127.0.0.1:3020/api/health >/dev/null 2>&1; then
                app_ok=1
                break
              fi
              sleep 2
            done
            if [ "$app_ok" -ne 1 ]; then
              echo "Health check failed after deploy."
              docker compose ps
              docker compose logs --tail=200 web
              exit 1
            fi

            install_site() {
              src="$1"
              if [ -d /etc/nginx/sites-available ]; then
                cp "$src" /etc/nginx/sites-available/letsallpaint.com
                ln -sf /etc/nginx/sites-available/letsallpaint.com /etc/nginx/sites-enabled/letsallpaint.com
              else
                cp "$src" /etc/nginx/conf.d/letsallpaint.com.conf
              fi
              nginx -t
              systemctl reload nginx
            }

            env_value() {
              grep -E "^[[:space:]]*$1=" .env | head -1 | cut -d= -f2- | sed 's/^["'\'']//; s/["'\'']$//' | tr -d '\r'
            }
            EMAIL="$(env_value LETSENCRYPT_EMAIL)"
            if [ -z "$EMAIL" ]; then
              EMAIL="$(env_value ADMIN_EMAIL)"
            fi

            mkdir -p /var/www/certbot
            if [ ! -f /etc/letsencrypt/live/letsallpaint.com/fullchain.pem ]; then
              install_site nginx/letsallpaint.com.http.conf
              if ! command -v certbot >/dev/null 2>&1; then
                apt-get update && apt-get install -y certbot
              fi
              if ! certbot certonly --webroot -w /var/www/certbot \
                --cert-name letsallpaint.com \
                -d letsallpaint.com -d www.letsallpaint.com \
                --email "$EMAIL" --agree-tos --no-eff-email --non-interactive; then
                echo "Certificate including www failed. Requesting letsallpaint.com only."
                certbot certonly --webroot -w /var/www/certbot \
                  --cert-name letsallpaint.com \
                  -d letsallpaint.com \
                  --email "$EMAIL" --agree-tos --no-eff-email --non-interactive
              fi
            else
              certbot renew --quiet || true
            fi

            install_site nginx/letsallpaint.com.conf

            echo "Waiting for HTTPS..."
            for i in $(seq 1 15); do
              if curl -fsS --resolve letsallpaint.com:443:127.0.0.1 https://letsallpaint.com/api/health >/dev/null 2>&1; then
                echo "Deploy healthy at https://letsallpaint.com"
                exit 0
              fi
              sleep 2
            done
            echo "HTTPS health check failed."
            nginx -t || true
            exit 1
