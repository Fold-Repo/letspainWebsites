services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paints
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paints}
      POSTGRES_DB: letsallpaints
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - paints-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paints -d letsallpaints"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    ports:
      - "3010:3010"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3010
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://paints:${POSTGRES_PASSWORD:-paints}@db:5432/letsallpaints
    volumes:
      - paints-uploads:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  paints-pg:
  paints-uploads:
